name: Check

# Every push and pull request: the Lua compiles, the TOCs point at real
# files, and the in-game release notes match CHANGELOG.md.
on:
  push:
    branches: ["main", "release/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Checks
        run: python3 tools/check.py
