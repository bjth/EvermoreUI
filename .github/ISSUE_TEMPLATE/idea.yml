name: Idea or improvement
description: Something you'd like added or changed.
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Which part of the UI?
      options:
        - Unit Frames
        - Nameplates
        - Action Bars
        - Auras
        - Minimap
        - Objective Tracker
        - Data Bars
        - Micro Menu / Bag Bar
        - Chat
        - Tooltips
        - Window Skins
        - Quality of Life
        - Options window / Edit Mode
        - Something new
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or annoyance, in your own words. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: How you picture it working. Screenshots from other UIs are welcome.
